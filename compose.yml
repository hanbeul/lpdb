
services:
  api:
    build: ./api
    ports:
      - 8080:8080
    depends_on:
      - db
    volumes:
      - ./api:/usr/src/app
  db:
    container_name: db
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"

volumes:
  db_data:
